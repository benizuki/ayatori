#cloud-config

# Container-Optimized OSではwrite_filesとruncmdが毎ブート実行されます。
# deploy-cos.shが下のプレースホルダーへstartup.shを埋め込み、
# 完成したCloud ConfigをVMメタデータのuser-dataへ登録します。
write_files:
  - path: /var/lib/ayatori/bootstrap.sh
    owner: root:root
    permissions: '0755'
    content: |
      __AYATORI_BOOTSTRAP_SCRIPT__

  - path: /etc/systemd/system/ayatori-bootstrap.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Prepare storage and deploy the Ayatori container
      Wants=network-online.target
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/bin/bash /var/lib/ayatori/bootstrap.sh
      TimeoutStartSec=0
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl start ayatori-bootstrap.service
