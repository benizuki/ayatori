[project]
name = "ayatori"
version = "0.1.0"
description = "Business-flow analysis application backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "google-cloud-texttospeech>=2.37.0",
    "google-genai>=2.19.0",
    "pydantic>=2.13.4",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
